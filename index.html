<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34497A">
<title>漫剧雷达 · 选题工作台</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#34497A">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="漫剧雷达">
<style>
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --line:#E8E6E0; --line2:#DCD9D2;
  --ink:#1C2321; --ink2:#5C6360; --ink3:#939A96;
  --brand:#3B549C; --brand-soft:#EAEEFA;
  --amber:#A9741F; --amber-soft:#FAF1DF;
  --red:#A5382F; --red-soft:#FBEAE7;
  --blue:#2C5F8A; --blue-soft:#E9F1F8;
  --sh-1:0 1px 2px rgba(28,35,33,.04);
  --sh-2:0 2px 10px -3px rgba(28,35,33,.10);
  --sh-3:0 16px 34px -18px rgba(28,35,33,.26);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.statusbar{
  flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;color:var(--ink);
}
.statusbar .sb-time{font-size:13.5px;font-weight:600;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.statusbar .sb-icons{display:flex;align-items:center;gap:5px}
.statusbar .sb-icons svg{display:block}
.statusbar .sb-icons .f{fill:currentColor}
.statusbar .sb-icons .l{fill:none;stroke:currentColor;stroke-width:1.1}
@media(max-width:560px){ .statusbar{display:none} }
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);font-size:14px;line-height:1.6;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  -webkit-font-smoothing:antialiased;
  background-color:#F4F3EF;
  background-image:
    radial-gradient(circle at 16% 6%, rgba(59,84,156,.085), transparent 42%),
    radial-gradient(circle at 88% 90%, rgba(169,116,31,.07), transparent 46%),
    linear-gradient(rgba(28,35,33,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(28,35,33,.02) 1px, transparent 1px);
  background-size:auto, auto, 28px 28px, 28px 28px;
  background-attachment:fixed;
}

  box-shadow:0 32px 72px -24px rgba(20,40,34,.32),0 0 0 1px rgba(28,35,33,.06),inset 0 1px 0 rgba(255,255,255,.7);
}
@media(max-width:560px){
  body{padding:0;background:var(--bg)}
  .phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}

.topbar{
  flex:none;padding:2px 20px 13px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;
}
.tb-title{font-size:22px;font-weight:600;letter-spacing:-.6px;line-height:1.2}
.tb-sub{font-size:11px;color:var(--ink3);margin-top:4px;letter-spacing:.3px;font-weight:500}
.pill{
  flex:none;font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid var(--line2);
  background:#fff;color:var(--ink2);font-family:inherit;cursor:pointer;
  transition:transform .12s,box-shadow .12s,background .15s;box-shadow:var(--sh-1);
}
.pill:active{transform:scale(.96)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 3px 10px -3px rgba(28,35,33,.4)}

.pages{flex:1;position:relative;overflow:hidden}
.page{
  position:absolute;inset:0;overflow-y:auto;padding:2px 20px 24px;display:none;
  -webkit-overflow-scrolling:touch;
  background:
    radial-gradient(72% 46% at 12% -2%, rgba(59,84,156,.055), rgba(255,255,255,0) 62%),
    radial-gradient(62% 42% at 96% 20%, rgba(169,116,31,.045), rgba(255,255,255,0) 60%),
    radial-gradient(56% 36% at 28% 76%, rgba(44,95,138,.045), rgba(255,255,255,0) 62%),
    radial-gradient(52% 32% at 86% 94%, rgba(163,78,110,.04), rgba(255,255,255,0) 60%);
  background-attachment:local;
}
.page::-webkit-scrollbar{width:0;height:0}
.page.active{display:block;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.tabbar{
  flex:none;display:flex;background:#fff;border-top:1px solid var(--line);
  padding:7px 8px max(7px,env(safe-area-inset-bottom));
  box-shadow:0 -8px 22px -16px rgba(28,35,33,.28);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;font-family:inherit;font-size:10.5px;color:var(--ink3);
  cursor:pointer;padding:6px 0 5px;margin:0 2px;border-radius:11px;
  transition:color .16s,background .16s,transform .16s;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .16s}
.tab.on{color:var(--brand);background:var(--brand-soft)}
.tab.on svg{stroke-width:1.95}
.tab:active{transform:scale(.94)}

.brief{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,
    rgba(48,64,148,.88) 0%,
    rgba(80,54,142,.84) 48%,
    rgba(28,98,148,.88) 100%);
  backdrop-filter:blur(32px) saturate(1.75);
  -webkit-backdrop-filter:blur(32px) saturate(1.75);
  color:#fff;border-radius:18px;padding:18px 19px;margin-top:4px;
  border:1px solid rgba(255,255,255,.3);
  box-shadow:
    0 18px 40px -18px rgba(58,80,150,.45),
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -1px 0 rgba(255,255,255,.1);
}
.brief::after{
  content:"";position:absolute;right:-52px;top:-52px;width:150px;height:150px;border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 0 16px rgba(255,255,255,.055),0 0 0 38px rgba(255,255,255,.028);
  pointer-events:none;
}
.brief::before{
  content:"";position:absolute;right:22px;top:22px;width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.85);box-shadow:0 0 10px 2px rgba(255,255,255,.45);
  pointer-events:none;
}
.brief>*{position:relative;z-index:1}
.brief-k{font-size:10.5px;letter-spacing:1px;opacity:.85;text-transform:uppercase}
.brief-v{font-size:15px;font-weight:500;margin-top:8px;line-height:1.5}
.brief-v em{font-style:normal;font-size:19px;font-weight:600;letter-spacing:-.5px}
.brief-d{font-size:11.5px;opacity:.7;margin-top:8px;line-height:1.55}

.seg{display:flex;gap:4px;background:#EBE9E3;border-radius:10px;padding:3px;margin-top:14px}
.seg button{
  flex:1;padding:7px 0;border:none;background:none;border-radius:8px;
  font-family:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.15s;
}
.seg button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.05)}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 1px 2px rgba(28,35,33,.035)}
.sec-t{font-size:11.5px;color:var(--ink3);margin:20px 0 2px;letter-spacing:.3px}

.gitem{
  background:var(--card,#FFFFFF);
  background:color-mix(in srgb, var(--card,#FFFFFF) 74%, transparent);
  backdrop-filter:blur(15px) saturate(1.35);
  -webkit-backdrop-filter:blur(15px) saturate(1.35);
  border:1px solid rgba(255,255,255,.72);
  border-radius:16px;margin-top:9px;overflow:hidden;
  transition:box-shadow .16s,background .16s,transform .22s cubic-bezier(.22,.82,.3,1);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.92),
    0 2px 6px rgba(28,35,33,.05),
    0 10px 24px -14px rgba(28,35,33,.26);
}
@media(hover:hover) and (pointer:fine){
  .gitem:not(.open):hover{
    transform:scale(1.018);
    position:relative;z-index:3;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 30px -15px rgba(28,35,33,.32);
  }
}
.gitem:not(.open):active{
  transform:scale(1.042);
  position:relative;z-index:4;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.98),0 20px 38px -18px rgba(28,35,33,.44);
}
.ghead{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer}
.grank{font-size:10.5px;color:var(--ink3);width:12px;flex:none;font-variant-numeric:tabular-nums}
.gico{
  width:46px;height:46px;border-radius:13px;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px -2px rgba(28,35,33,.18);
}
.gico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.gico img{width:100%;height:100%;object-fit:cover;display:block}
.gname{flex:1;font-size:13.5px;font-weight:500;line-height:1.4}
.gname i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.gscore{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px;flex:none}
.gbody{display:none;padding:14px 15px 16px;border-top:1px solid #F2F0EB;background:#FCFBF8}
.gitem.open .gbody{display:block}
.gitem.open{
  background:color-mix(in srgb, var(--card,#FFFFFF) 86%, transparent);
  border-color:rgba(255,255,255,.88);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 32px -18px rgba(28,35,33,.32);
}

.dims{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px}
.dim-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ink2);margin-bottom:5px}
.dim-h b{font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:5px;background:#EDEBE5;border-radius:100px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:100px;width:0;transition:width .55s cubic-bezier(.2,.85,.25,1)}

.gsec{font-size:11px;color:var(--ink3);margin:16px 0 8px}
.jtag{font-size:9.5px;color:var(--ink3);font-weight:400;margin-left:7px;letter-spacing:0;opacity:.85}

/* ============================================================
   媒体：视频存 IndexedDB，抽帧用 canvas
   ============================================================ */
let _db = null;
function openDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise(function(res, rej){
    const r = indexedDB.open('manju_media', 1);
    r.onupgradeneeded = function(){
      const db = r.result;
      if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'id' });
    };
    r.onsuccess = function(){ _db = r.result; res(_db); };
    r.onerror = function(){ rej(r.error); };
  });
}

function putVideo(rec){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      const tx = db.transaction('videos', 'readwrite');
      tx.objectStore('videos').put(rec);
      tx.oncomplete = function(){ res(rec.id); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}

function getVideo(id){
  if (!id) return Promise.resolve(null);
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      const tx = db.transaction('videos', 'readonly');
      const rq = tx.objectStore('videos').get(id);
      rq.onsuccess = function(){ res(rq.result || null); };
      rq.onerror = function(){ rej(rq.error); };
    });
  }).catch(function(){ return null; });
}

function delVideo(id){
  if (!id) return Promise.resolve();
  return openDB().then(function(db){
    const tx = db.transaction('videos', 'readwrite');
    tx.objectStore('videos').delete(id);
    return new Promise(function(res){ tx.oncomplete = function(){ res(); }; });
  }).catch(function(){});
}

const VURL = {};
function videoURL(rec){
  if (!rec || !rec.blob) return null;
  if (!VURL[rec.id]) VURL[rec.id] = URL.createObjectURL(rec.blob);
  return VURL[rec.id];
}

function fmtSize(b){
  if (!b) return '—';
  if (b > 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
  if (b > 1048576) return (b / 1048576).toFixed(1) + ' MB';
  return Math.round(b / 1024) + ' KB';
}

function fmtTime(s){
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (h) return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function grabThumb(src, time){
  return new Promise(function(resolve){
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'auto';
    let done = false;
    const finish = function(url){
      if (done) return;
      done = true;
      v.removeAttribute('src');
      try { v.load(); } catch (e) {}
      resolve(url);
    };
    const timer = setTimeout(function(){ finish(null); }, 9000);

    v.addEventListener('loadeddata', function(){
      const d = v.duration || 0;
      const t = d > 0 ? Math.min(time, Math.max(0, d - 0.1)) : time;
      try { v.currentTime = t; } catch (e) { clearTimeout(timer); finish(null); }
    });
    v.addEventListener('seeked', function(){
      try {
        const w = 260;
        const h = Math.round(w * (v.videoHeight || 9) / (v.videoWidth || 16)) || 146;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(v, 0, 0, w, h);
        clearTimeout(timer);
        finish(c.toDataURL('image/jpeg', 0.62));
      } catch (e) { clearTimeout(timer); finish(null); }
    });
    v.addEventListener('error', function(){ clearTimeout(timer); finish(null); });
    v.src = src;
  });
}

function toSec(str){
  const p = String(str).trim().replace(',', '.').split(':').map(Number);
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if (p.length === 2) return p[0] * 60 + p[1];
  return 0;
}

function parseSRT(txt){
  const out = [];
  String(txt).replace(/\r/g, '').split(/\n{2,}/).forEach(function(block){
    const lines = block.split('\n').filter(function(l){ return l.trim() !== ''; });
    if (!lines.length) return;
    const i = lines.findIndex(function(l){ return l.indexOf('-->') > -1; });
    if (i < 0) return;
    const parts = lines[i].split('-->');
    if (parts.length < 2) return;
    const start = toSec(parts[0]);
    const end = toSec(parts[1].trim().split(/\s+/)[0]);
    const text = lines.slice(i + 1).join(' ').trim();
    if (!text) return;
    out.push({ start: start, end: end, text: text });
  });
  return out;
}

function riskTexts(g){
  const h = g.hongguo.count, d = g.douyin.count;
  const s = Math.round(g.sequel * 100);
  const cur = S.plat === 'hongguo' ? h : d;
  const other = S.plat === 'hongguo' ? 'douyin' : 'hongguo';
  const oc = g[other].count;
  const out = [];

  if (cur >= 15) out.push(PLATN[S.plat] + '端 ' + cur + ' 部在榜，供给已经很挤，新片得靠开局的硬钩子抢位置');
  else if (cur >= 8) out.push(PLATN[S.plat] + '端 ' + cur + ' 部在榜，中等竞争，差异化还能站住');
  else if (cur >= 3) out.push(PLATN[S.plat] + '端只有 ' + cur + ' 部，位置空着，但验证也不足');
  else out.push(PLATN[S.plat] + '端只有 ' + cur + ' 部，几乎没人做——可能是窗口，也可能是坑');

  if (s >= 60) out.push('续作占 ' + s + '%，头部被系列占满，新 IP 首季很难挤进去');
  else if (s >= 35) out.push('续作占 ' + s + '%，还有一半位置留给新 IP');
  else out.push('续作只占 ' + s + '%，新 IP 位置充足');

  if (oc >= 10 && cur <= 5) out.push(PLATN[other] + '端已有 ' + oc + ' 部验证，这边还没跟上');
  else if (oc >= 10 && cur >= 10) out.push('两端都过了十部，跨端都饱和，只能拼执行');

  return out.concat(g.risks).slice(0, 4);
}

function countUp(el, target, dur){
  if (!el || !isFinite(target)) return;
  const t0 = performance.now();
  const d = dur || 620;
  function step(now){
    const p = Math.min(1, (now - t0) / d);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function genreIcon(gid){
  const ic = GENRE_ICON[gid];
  if (!ic) return '';
  const inner = ic.img
    ? '<img src="' + ic.img + '" alt="">'
    : '<svg viewBox="0 0 24 24">' + ic.svg + '</svg>';
  return '<span class="gico" style="background:' + ic.bg + ';color:' + ic.c + '">' + inner + '</span>';
}

function calc(g, plat){
  const other = plat === 'hongguo' ? 'douyin' : 'hongguo';
  const t = g[plat], o = g[other];
  const heat = t.heat * .65 + o.heat * .35;
  const supply = 100 - Math.min(100, t.count / maxCount(plat) * 100);
  const entry = 100 - g.sequel * 100;
  const trend = TREND[t.trend] || 58;
  return {
    total: Math.round(heat * W.heat + supply * W.supply + entry * W.entry + trend * W.trend),
    heat: Math.round(heat), supply: Math.round(supply),
    entry: Math.round(entry), trend: Math.round(trend),
    count: t.count, diff: t.heat - o.heat
  };
}

/* 数据新鲜度：过期不是报错，是让结论自己承认不可信 */
function dataAge(){
  if (!DATA.updated) return 0;
  const t = new Date(DATA.updated + 'T00:00:00').getTime();
  if (isNaN(t)) return 0;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}

function freshInfo(){
  const a = dataAge();
  if (a <= 30) return { k:'ok', t:'新鲜', c:'#34497A', bg:'#EAEEF7', note:'一个月内校准过，可以按这些分数判断。' };
  if (a <= 60) return { k:'warn', t:'偏旧', c:'#A9741F', bg:'#FAF1DF', note:'超过一个月没校准。题材轮动快，建议先看最新一期榜单再决定。' };
  if (a <= 120) return { k:'old', t:'已过期', c:'#A5382F', bg:'#FBEAE7', note:'三个月以上没更新。这些分数只能当历史参照，不要直接拿去立项。' };
  return { k:'dead', t:'已失效', c:'#A5382F', bg:'#FBEAE7', note:'数据已经是半年前的。这个行业题材周期通常只有 4—8 周，请务必重新校准。' };
}

function colOf(s){
  if (s >= 76) return '#34497A';
  if (s >= 66) return '#2C5F8A';
  if (s >= 52) return '#A9741F';
  return '#A5382F';
}
function gradeOf(s){
  if (s >= 76) return { t: '值得做', bg: '#EAEEF7', fg: '#34497A', s: '窗口还开着' };
  if (s >= 66) return { t: '可以试', bg: '#E9F1F8', fg: '#2C5F8A', s: '要做出差异' };
  if (s >= 52) return { t: '谨慎', bg: '#FAF1DF', fg: '#A9741F', s: '红海边缘' };
  return { t: '不建议', bg: '#FBEAE7', fg: '#A5382F', s: '别当分母' };
}
function tagHtml(s){
  const g = gradeOf(s);
  return '<span class="tag" style="background:' + g.bg + ';color:' + g.fg + '">' + g.t + ' · ' + g.s + '</span>';
}

/* ============================================================
   雷达
   ============================================================ */
function ranked(plat){
  return DATA.genres.map(function(g){
    return { g: g, r: calc(g, plat) };
  }).sort(function(a, b){ return b.r.total - a.r.total; });
}

function bonusList(plat){
  const other = plat === 'hongguo' ? 'douyin' : 'hongguo';
  return DATA.genres.filter(function(g){
    return g[plat].heat - g[other].heat <= -18 && g[plat].trend !== 'declining';
  });
}

function renderRadar(){
  const list = ranked(S.plat);
  const top = list[0];
  const bonus = bonusList(S.plat);

  document.getElementById('briefV').innerHTML =
    esc(top.g.name) + ' <em>' + top.r.total + '</em> 分，当前最高';
  document.getElementById('briefD').textContent = bonus.length
    ? '另有 ' + bonus.length + ' 个题材出现时间差红利：' + bonus.map(function(g){ return g.name; }).join('、') + '。在' + PLATN[S.plat] + '端还没被填满。'
    : '当前没有明显的时间差机会，' + PLATN[S.plat] + '端的供给已经跟上了。建议等下一期榜单。';

  document.getElementById('radarList').innerHTML = list.map(function(x, i){
    const g = x.g, r = x.r, c = colOf(r.total);
    const open = S.openId === g.id;
    return '<div class="gitem' + (open ? ' open' : '') + '" data-id="' + g.id + '" style="--card:' + ((GENRE_ICON[g.id] || {}).card || '#FFFFFF') + '">' +
      '<div class="ghead">' +
        genreIcon(g.id) +
        '<span class="grank">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</span>' +
        '<span class="gname">' + esc(g.name) + '<i>' + r.count + ' 部在榜 · 续作 ' + Math.round(g.sequel * 100) + '%</i></span>' +
        '<span class="gscore" style="color:' + c + '">' + r.total + '</span>' +
      '</div>' +
      '<div class="gbody">' + detailHtml(g, r) + '</div>' +
    '</div>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('.ghead'), function(h){
    h.addEventListener('click', function(){
      const id = h.parentNode.getAttribute('data-id');
      S.openId = (S.openId === id) ? null : id;
      renderRadar();
      if (S.openId){
        const el = document.querySelector('.gitem[data-id="' + S.openId + '"]');
        if (el) requestAnimationFrame(function(){ animateBars(el); });
      }
    });
  });

  const fi = freshInfo();
  const fr = document.getElementById('freshRow');
  if (fr){
    fr.innerHTML = '<span class="dot" style="background:' + fi.c + '"></span>' +
      '数据截至 ' + esc(DATA.updated) + ' · 已 ' + dataAge() + ' 天（' + fi.t + '）' +
      '<span class="go">校准</span>';
  }

  animateBars();
}

function detailHtml(g, r){
  const dims = [
    { k: '市场热度', v: r.heat },
    { k: '供给空间', v: r.supply },
    { k: '新 IP 友好度', v: r.entry },
    { k: '趋势动能', v: r.trend }
  ];
  const c = colOf(r.total);

  const dimHtml = dims.map(function(d){
    return '<div><div class="dim-h"><span>' + d.k + '</span><b style="color:' + c + '">' + d.v + '</b></div>' +
      '<div class="bar"><i data-w="' + d.v + '" style="background:' + c + '"></i></div></div>';
  }).join('');

  const sampleHtml = g.samples.slice(0, 3).map(function(s){
    return '<div class="mini"><div class="n">' + esc(s.n) + '</div>' +
      '<div class="h">' + esc(s.h) + '</div><div class="p">' + esc(s.p) + '</div>' +
      (s.why ? '<div class="w">' + esc(s.why) + '</div>' : '') + '</div>';
  }).join('');

  const riskHtml = riskTexts(g).map(function(x){ return '<div class="risk">' + esc(fillVars(x, g)) + '</div>'; }).join('');

  const names = [
    g.naming.a[0] + '，' + g.naming.b[0],
    g.naming.a[1] ? g.naming.a[1] + '之' + g.naming.b[1] : g.naming.a[0] + '之' + g.naming.b[1],
    g.naming.a[2] ? g.naming.a[2] + '·第' + (Math.round(g.sequel * 6) + 2) + '季' : g.naming.a[0] + '·第二季'
  ];
  const nameHtml = names.map(function(n){ return '<span class="nm">' + esc(n) + '</span>'; }).join('');

  const jAt = DATA.judgedAt || DATA.updated;
  const jAge = Math.max(0, Math.floor((Date.now() - new Date(jAt + 'T00:00:00').getTime()) / 86400000));
  const judgeTag = '<span class="jtag' + (jAge > 60 ? ' warn' : '') + '">判断写于 ' + jAt +
    (jAge > 60 ? '，已 ' + jAge + ' 天' : '') + '</span>';

  let timing = '';
  const other = S.plat === 'hongguo' ? 'douyin' : 'hongguo';
  if (r.diff <= -18 && g[S.plat].trend !== 'declining'){
    timing = '抖音已验证（热度 ' + g[other].heat + '），' + PLATN[S.plat] + '端只到 ' + g[S.plat].heat + '，结构搬过来还有 2—4 周窗口。';
  } else if (r.diff >= 18){
    timing = '这边比' + PLATN[other] + '高 ' + r.diff + ' 个点，是本题材的主需求端，但供给也在跟进——要抢的是增量还是存量？';
  } else {
    timing = '两端热度接近，没有跨平台时间差，只能拼执行。';
  }

  return '<div class="dims">' + dimHtml + '</div>' +
    '<div class="gsec">对标爆款</div><div class="mini3">' + sampleHtml + '</div>' +
    '<div class="gsec">跨平台判断</div><div class="edge">' + esc(timing) + '</div>' +
    '<div class="gsec">差异化在哪</div><div class="edge" style="margin-top:0">' + esc(g.edge) + '</div>' +
    '<div class="gsec">风险' + judgeTag + '</div>' + riskHtml +
    '<div class="gsec">命名结构</div><div class="nmwrap">' + nameHtml + '</div>';
}

function animateBars(root){
  const scope = root || document;
  Array.prototype.forEach.call(scope.querySelectorAll('.bar i'), function(el, i){
    const w = el.getAttribute('data-w');
    el.style.width = '0';
    setTimeout(function(){ el.style.width = w + '%'; }, 30 + i * 55);
  });
}

/* ============================================================
   数据源：校准 / 导入 / 导出 / 远程拉取
   ============================================================ */
function saveData(){
  try { localStorage.setItem(DATA_KEY, JSON.stringify(DATA)); }
  catch (e) { alert('数据存不下，可能是浏览器配额满了。'); }
}

function saveSettings(){
  try {
    localStorage.setItem('manju_settings', JSON.stringify({
      remoteUrl: S.remoteUrl || '',
      autoSync: S.autoSync,
      lastSync: S.lastSync || ''
    }));
  } catch (e) {}
}
function loadSettings(){
  try {
    const d = JSON.parse(localStorage.getItem('manju_settings') || '{}');
    if (d.remoteUrl) S.remoteUrl = d.remoteUrl;
    if (d.autoSync === false) S.autoSync = false;
    if (d.lastSync) S.lastSync = d.lastSync;
  } catch (e) {}
}

function stamp(){
  const d = new Date();
  const p = function(n){ return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function renderData(){
  const fi = freshInfo();
  const box = document.getElementById('dataBody');
  if (!box) return;

  const rows = DATA.genres.map(function(g){
    const trendSel = ['rising:上升', 'stable:横盘', 'declining:退潮'].map(function(o){
      const p = o.split(':');
      return '<option value="' + p[0] + '"' + (g.hongguo.trend === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
    }).join('');

    const samples = g.samples || [];
    const sampRows = samples.map(function(s){
      const platSel = ['红果', '抖音', '双榜'].map(function(p){
        return '<option' + (s.p === p ? ' selected' : '') + '>' + p + '</option>';
      }).join('');
      return '<div class="samp-row">' +
        '<input class="s-n" placeholder="剧名" value="' + esc(s.n) + '">' +
        '<select class="s-p">' + platSel + '</select>' +
        '<input class="s-h" placeholder="热度" value="' + esc(s.h) + '">' +
        '<button class="s-del" type="button">×</button>' +
      '</div>';
    }).join('');

    return '<div class="calib" data-g="' + g.id + '">' +
      '<div class="calib-n">' + esc(g.name) + '</div>' +
      '<div class="calib-f">' +
        '<span>红果</span><input type="number" min="0" data-p="hongguo" value="' + (g.hongguo.count || 0) + '">' +
        '<span>抖音</span><input type="number" min="0" data-p="douyin" value="' + (g.douyin.count || 0) + '">' +
        '<select data-p="trend">' + trendSel + '</select>' +
      '</div>' +
      '<div class="samp-toggle"><b>对标爆款</b> ' + samples.length + ' 条 · 展开</div>' +
      '<div class="samp-box" style="display:none">' + sampRows +
        '<button class="s-add" type="button">+ 加一条</button>' +
      '</div>' +
    '</div>';
  }).join('');

  box.innerHTML =
    '<div class="d-hero">' +
      '<div class="d-name">数据源</div>' +
      '<div class="d-meta">当前版本 ' + esc(DATA.updated) + ' · ' + DATA.genres.length + ' 个题材</div>' +
      '<div class="d-stats">' +
        '<div>已过去<b style="color:' + fi.c + '">' + dataAge() + ' 天</b></div>' +
        '<div>状态<b style="color:' + fi.c + '">' + fi.t + '</b></div>' +
        '<div>样本<b>200 部</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="qmiss" style="background:' + fi.bg + ';color:' + fi.c + '">' + fi.note + '</div>' +

    '<div class="card">' +
      '<div style="font-size:12px;color:#939A96;margin-bottom:6px">快速校准</div>' +
      '<div style="font-size:11px;color:#939A96;line-height:1.65;margin-bottom:4px">看完最新一期百强榜，把每个题材的在榜数量改掉。保存后日期自动更到今天。</div>' +
      rows +
      '<button class="btn" id="calibSave" style="margin-top:14px">保存并更新到今天</button>' +
    '</div>' +

    '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">' +
        '<span style="font-size:12px;color:#939A96">远程数据源</span>' +
        '<button class="pill" id="autoToggle" style="font-size:10.5px;padding:4px 10px">' +
          (S.autoSync ? '自动同步 · 开' : '自动同步 · 关') + '</button>' +
      '</div>' +
      '<div style="font-size:11px;color:#939A96;line-height:1.65;margin-bottom:10px">填一个返回 JSON 的地址，打开时自动拉取。配合 auto/ 目录的管道可做到全自动。</div>' +
      '<input id="remoteUrl" placeholder="https://你的用户名.github.io/仓库名/data.json" value="' + esc(S.remoteUrl || '') + '">' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="btn ghost sm" id="remotePull" style="flex:1">立即同步</button>' +
        '<button class="btn ghost sm" id="exportBtn" style="flex:1">导出数据</button>' +
      '</div>' +
      (S.lastSync ? '<div style="font-size:10.5px;color:#939A96;margin-top:9px">上次同步：' + esc(S.lastSync) + '</div>' : '') +
    '</div>' +

    '<div class="card">' +
      '<div style="font-size:12px;color:#939A96;margin-bottom:10px">手动导入</div>' +
      '<textarea id="jsonIn" style="min-height:104px;font-size:11px" placeholder="把导出的 JSON 粘进来，或者换成你整理的新一期数据"></textarea>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="btn ghost sm" id="importBtn" style="flex:1">导入并覆盖</button>' +
        '<button class="btn ghost sm" id="resetBtn" style="flex:1">恢复内置基线</button>' +
      '</div>' +
    '</div>' +

    '<div class="foot">为什么不能全自动：DataEye 的百强榜是每月发的文章，没有公开 API；红果和抖音的榜单页有跨域限制，浏览器里 fetch 会被直接拦掉。要么有人在服务端定时抓，要么手动更新一次——这个页面就是为后者准备的。</div>';

  document.getElementById('calibSave').addEventListener('click', saveCalib);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', importJson);
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('恢复到内置的 2026-11 基线数据？你导入或校准过的内容会被覆盖。')) return;
    DATA = JSON.parse(JSON.stringify(DATA_BASE));
    saveData(); renderData(); renderRadar();
  });
  document.getElementById('remotePull').addEventListener('click', function(){
    S.remoteUrl = document.getElementById('remoteUrl').value.trim();
    saveSettings();
    syncRemote(false);
  });
  document.getElementById('autoToggle').addEventListener('click', function(){
    S.autoSync = !S.autoSync;
    saveSettings();
    renderData();
  });

  box.onclick = function(e){
    const t = e.target;
    if (!t || !t.closest) return;

    const del = t.closest('.s-del');
    if (del){
      const r = del.closest('.samp-row');
      if (r) r.remove();
      return;
    }

    const add = t.closest('.s-add');
    if (add){
      const sb = add.parentNode;
      const wrap = document.createElement('div');
      wrap.className = 'samp-row';
      wrap.innerHTML = '<input class="s-n" placeholder="剧名">' +
        '<select class="s-p"><option>红果</option><option>抖音</option><option>双榜</option></select>' +

    const tog = t.closest('.samp-toggle');
    if (tog){
      const sb = tog.nextElementSibling;
      const open = sb.style.display !== 'none';
      sb.style.display = open ? 'none' : '';
      tog.innerHTML = '<b>对标爆款</b> ' + sb.querySelectorAll('.samp-row').length + ' 条 · ' + (open ? '展开' : '收起');
    }
  };
}

function saveCalib(){
  let n = 0;
  Array.prototype.forEach.call(document.querySelectorAll('#dataBody .calib'), function(row){
    const g = DATA.genres.filter(function(x){ return x.id === row.getAttribute('data-g'); })[0];
    if (!g) return;
    ['hongguo', 'douyin'].forEach(function(p){
      const el = row.querySelector('input[data-p="' + p + '"]');
      if (el) g[p].count = Math.max(0, parseInt(el.value, 10) || 0);
    });
    const t = row.querySelector('select[data-p="trend"]');
    if (t) g.hongguo.trend = t.value;

    const arr = [];
    Array.prototype.forEach.call(row.querySelectorAll('.samp-row'), function(sr){
      const nEl = sr.querySelector('.s-n');
      const nm = nEl ? nEl.value.trim() : '';
      if (!nm) return;
      const hEl = sr.querySelector('.s-h');
      arr.push({
        n: nm,
        p: sr.querySelector('.s-p').value,
        h: (hEl && hEl.value.trim()) || '—',
        v: 1,
        why: ''
      });
    });
    if (arr.length) g.samples = arr;

    n++;
  });
  DATA.updated = new Date().toISOString().slice(0, 10);
  saveData();
  renderData(); renderRadar();
  alert('已更新 ' + n + ' 个题材，日期改为 ' + DATA.updated);
}

function exportData(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'manju-data-' + DATA.updated + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
}

function importJson(){
  const txt = document.getElementById('jsonIn').value.trim();
  if (!txt){ alert('先粘一段 JSON'); return; }
  try {
    const d = JSON.parse(txt);
    if (!d || !Array.isArray(d.genres) || !d.genres.length) throw new Error('缺少 genres 数组');
    if (!d.updated) d.updated = new Date().toISOString().slice(0, 10);
    if (!d.benchmark) d.benchmark = DATA.benchmark;
    DATA = d;
    saveData(); renderData(); renderRadar();
    alert('已导入 ' + d.genres.length + ' 个题材，版本 ' + d.updated);
  } catch (e) {
    alert('解析失败：' + e.message);
  }
}

function syncRemote(silent){
  const url = S.remoteUrl;
  if (!url){ if (!silent) alert('先填一个端点地址'); return; }
  fetch(url, { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){
      if (!d || !Array.isArray(d.genres)) throw new Error('返回的不是题材数据');
      if (!d.updated) d.updated = new Date().toISOString().slice(0, 10);
      DATA = d;
      saveData();
      S.lastSync = stamp() + ' · 成功（' + d.updated + '）';
      saveSettings();
      updateBasis();
      renderRadar();
      if (S.tab === 'data') renderData();
      if (!silent) alert('已更新到 ' + d.updated);
    })
    .catch(function(e){
      S.lastSync = stamp() + ' · 失败';
      saveSettings();
      if (S.tab === 'data') renderData();
      if (!silent) alert('拉取失败：' + e.message + '\n\n如果是跨域，把 JSON 放到支持 CORS 的地方，比如 GitHub Pages、对象存储或你自己的域名。');
    });
}

/* ---------- 创意诊断 ---------- */
function matchGenre(text){
  const q = text.toLowerCase();
  let best = null, bs = 0;
  DATA.genres.forEach(function(g){
    let hit = 0;
    g.alias.forEach(function(a){
      if (q.indexOf(a.toLowerCase()) > -1) hit += a.length >= 2 ? 2 : 1;
    });
    if (q.indexOf(g.name.toLowerCase()) > -1) hit += 3;
    if (hit > bs){ bs = hit; best = g; }
  });
  return bs > 0 ? { g: best, conf: Math.min(96, 52 + bs * 7) } : null;
}

function runDiag(){
  const v = document.getElementById('diagInput').value.trim();
  const out = document.getElementById('diagOut');
  if (!v){
    out.innerHTML = '<div class="res"><div class="res-d">先说一句你想做什么，哪怕很粗糙也行。</div></div>';
    return;
  }
  const m = matchGenre(v);
  if (!m){
    out.innerHTML = '<div class="res"><div class="res-t">没匹配到题材</div>' +
      '<div class="res-d">换个说法试试。比如「穿越七零」会匹配年代穿越，「后妈带孩子」会匹配家庭伦理。</div></div>';
    return;
  }
  const r = calc(m.g, S.plat);
  const c = colOf(r.total);
  const gd = gradeOf(r.total);
  out.innerHTML =
    '<div class="res">' +
      '<div class="res-h"><span class="res-big" style="color:' + c + '">' + r.total + '</span>' +
      '<span class="res-unit">/ 100 机会指数</span></div>' +
      '<div class="res-t">匹配到「' + esc(m.g.name) + '」<span style="color:#939A96;font-weight:400"> · 置信度 ' + m.conf + '%</span></div>' +
      '<div class="res-d">' + esc(verdictText(m.g, r)) + '</div>' +
      '<div style="margin-top:10px"><span class="tag" style="background:' + gd.bg + ';color:' + gd.fg + '">' + gd.t + ' · ' + gd.s + '</span></div>' +
      '<div style="margin-top:14px"><button class="btn ghost sm" id="diagJump">在榜单里看这个题材</button></div>' +
    '</div>';

  const dbig = out.querySelector('.res-big');
  if (dbig) countUp(dbig, r.total);

  document.getElementById('diagJump').addEventListener('click', function(){
    S.openId = m.g.id;
    document.querySelector('#radarSeg button[data-v="list"]').click();
    setTimeout(function(){
      const el = document.querySelector('.gitem[data-id="' + m.g.id + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
  });
}

function verdictText(g, r){
  const pn = PLATN[S.plat];
  const tr = { rising: '且仍在上升', stable: '但已经横盘', declining: '并且正在退潮' }[g[S.plat].trend];
  if (r.total >= 76) return pn + '端只有 ' + r.count + ' 部在榜，续作占比 ' + Math.round(g.sequel * 100) + '%，新 IP 还有位置。' + tr + '。';
  if (r.total >= 66) return pn + '端 ' + r.count + ' 部在榜，热度真实存在，供给还没饱和。但题材辨识度不高，要用更硬的开局钩子拉开差距。';
  if (r.total >= 52) return pn + '端已有 ' + r.count + ' 部在榜，续作 ' + Math.round(g.sequel * 100) + '%。' + tr + '。可以进，但要接受必须做到前 10% 才有回报。';
  return pn + '端在榜 ' + r.count + ' 部，续作 ' + Math.round(g.sequel * 100) + '%。' + tr + '。新 IP 拿不到位置。';
}

/* ============================================================
   标题工坊
   ============================================================ */
function judgeTitle(raw){
  const t = String(raw).trim();
  const len = Array.from(t).length;

  let lenS, lenNote;
  if (len >= 8 && len <= 20){ lenS = 25; lenNote = len + ' 字，在合适区间'; }
  else if (len > 20 && len <= 26){ lenS = 16; lenNote = len + ' 字，偏长'; }
  else if (len >= 5){ lenS = 10; lenNote = len + ' 字，不在主流区间'; }
  else { lenS = 4; lenNote = len + ' 字，信息量不够'; }

  const hasNum = /[0-9零一二三四五六七八九十百千万亿半两]/.test(t);
  const hasObj = /(房|车|卡|账本|火锅|薄荷|酒|药|钱|锅|门|楼|店|书|伞|糖|票|碗|箱|柜|田|铺|席|衣|鞋|表|戒指|钥匙|合同|病历|照片|本子)/.test(t);
  const specS = (hasNum ? 12 : 0) + (hasObj ? 13 : 0);
  const specNote = specS
    ? [hasNum ? '有数字' : '', hasObj ? '有具体物件' : ''].filter(Boolean).join(' + ')
    : '全是抽象词';

  const hasRole = /(后妈|保安|同事|邻居|婆婆|总裁|状元|村花|孤儿|赘婿|实习生|甲方|舅妈|继母|司机|保姆|公主|少爷|丫鬟|大小姐|老师|医生|律师|将军|皇帝|太子|太太|媳妇|小姨|姑姑|婆家|娘家|丑小鸭|万人迷|翻译官|纨绔|憨婿|养女|假千金|真千金|女配|男主|女主|反派|学霸|学渣|天才|废柴|上门女婿)/.test(t);
  const hasTurn = /(却|但|真|才是|没让你|竟|反而|原来|谁知|结果|竟然|偏偏|居然|让)/.test(t);
  const conS = (hasRole ? 15 : 0) + (hasTurn ? 10 : 0);
  const conNote = conS
    ? [hasRole ? '有身份标签' : '', hasTurn ? '有转折' : ''].filter(Boolean).join(' + ')
    : '没有身份或转折';

  const hasAct = /(整顿|盯上|镇压|逆袭|翻身|打脸|退婚|扫地出门|跪求|封神|碾压|扎心|背刺|复仇|抢走|刷|摔|撕|掀|翻脸|拒|逃|骗|赖|逼|砸|抓|骂|踹|夺|载|娶|嫁|离婚|断绝|踢出|赶出|认亲|搬空|断供|举报|实名)/.test(t);
  const hasSplit = /[，,：:—]/.test(t);
  const actS = (hasAct ? 16 : 0) + (hasSplit ? 9 : 0);
  const actNote = actS
    ? [hasAct ? '有冲突动作' : '', hasSplit ? '有分句结构' : ''].filter(Boolean).join(' + ')
    : '没有冲突动作';

  const dims = [
    { k: '长度适配', v: lenS, note: lenNote },
    { k: '具体度', v: specS, note: specNote },
    { k: '反差度', v: conS, note: conNote },
    { k: '动作感', v: actS, note: actNote }
  ];

  return {
    total: lenS + specS + conS + actS,
    dims: dims,
    weak: dims.filter(function(d){ return d.v < 15; }).map(function(d){ return d.k; }),
    len: len
  };
}

      '<div class="res-d">这个标题更像「' + esc(m.g.name) + '」。当期在榜作品：</div>' +
      '<div class="nmwrap" style="margin-top:10px">' + ex + '</div></div>';
  }

  const seriesNote = j.total < 60
    ? '<div class="qmiss" style="background:#F5F4F0;color:#5C6360"><b>例外情况：</b>如果这是系列续作的命名（第 N 季、数字尾缀），结构分可以豁免——观众是靠 IP 认知点进来的。但新 IP 不能这么起名。</div>'
    : '';

    '</div>' +

    fixHtml + seriesNote + refHtml;

  animateBars(out);
  const big = out.querySelector('.res-big');

function clipRow(c, showProject){

  const thumb = c.thumb
    ? '<img class="clip-thumb" src="' + c.thumb + '">'
    : '<div class="clip-thumb">点开<br>截图</div>';
  const meta = [];
  if (showProject && p) meta.push(p.name);
  if (c.tags && c.tags.length) meta.push(c.tags.join(' / '));
  if (c.used) meta.push('已用');

  return '<div class="clip" data-id="' + c.id + '">' + thumb +
    '<div class="clip-main">' +
      '<div class="clip-t">' + (c.start !== null && c.start !== undefined ? fmtTime(c.start) : '—') + ' · ' + esc(c.type) + '</div>' +

function bindClips(box){
  Array.prototype.forEach.call(box.querySelectorAll('.clip'), function(el){
    el.addEventListener('click', function(){ jumpToClip(el.getAttribute('data-id')); });

  Array.prototype.forEach.call(box.querySelectorAll('.clip-mark'), function(m){
    m.addEventListener('click', function(e){
      e.stopPropagation();
      const c = S.clips.filter(function(x){ return x.id === m.getAttribute('data-mark'); })[0];
      if (!c) return;
      c.used = !c.used;
      persist();
      m.classList.toggle('on', c.used);

    });

/* 导出打点清单：剪辑师或外包拿到原片 + 这份表，就能自己剪 */
function exportClips(){
  if (!S.clips.length){ alert('素材库还是空的，先在项目里打几个点'); return; }
  const rows = [['项目', '时间码', '台词', '标签', '类型', '状态']];
  S.clips.slice().sort(function(a, b){ return (a.start || 0) - (b.start || 0); })
    .forEach(function(c){
      const p = S.projects.filter(function(x){ return x.id === c.pid; })[0];
      rows.push([
        p ? p.title : '',
        fmtTime(c.start || 0),
        c.text || '',
        (c.tags || []).join(' / '),
        c.type || '',
        c.used ? '已用' : '未用'
      ]);
    });
  const csv = rows.map(function(r){
    return r.map(function(x){
      const s = String(x).replace(/"/g, '""');
      return /[",\n\r]/.test(s) ? '"' + s + '"' : s;
    }).join(',');
  }).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '漫剧素材清单_' + (DATA.updated || '') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

      '<label class="btn sm" style="display:inline-block;cursor:pointer">选择本地视频' +
        '<input type="file" accept="video/*" id="videoFile" style="display:none"></label>' +
    '</div>';
  }
  const url = videoURL(rec);
  return '<div class="vcard has">' +
    '<video class="vthumb" src="' + url + '" muted preload="metadata"></video>' +
    '<div style="flex:1;min-width:0">' +
      '<div class="vname">' + esc(rec.name) + '</div>' +
      '<div class="vsub">' + fmtSize(rec.size) + (rec.duration ? ' · ' + fmtTime(rec.duration) : '') + '</div>' +
    '</div>' +
    '<button class="btn sm" id="playVideo">播放</button>' +
  '</div>' +
  '<div style="display:flex;gap:8px;margin-top:10px">' +
    '<button class="btn ghost sm" id="delVideoBtn" style="flex:1">删除视频</button>' +

function hydrateVideo(p){
  const slot = document.getElementById('vslot');
  if (!slot) return;
  getVideo(p.videoId).then(function(rec){
    p.videoRec = rec;
    slot.innerHTML = videoBlockHtml(p, rec);

    const fileEl = document.getElementById('videoFile');
    if (fileEl){
      fileEl.addEventListener('change', function(e){ handleVideoFile(p, e.target.files[0]); });
    }
    const playEl = document.getElementById('playVideo');
    if (playEl){
      playEl.addEventListener('click', function(){
        if (rec) openPlayer(rec, null, p.id);
      });
    }
    const delEl = document.getElementById('delVideoBtn');
    if (delEl){
      delEl.addEventListener('click', function(){
        if (!confirm('删除这个视频？素材索引会保留，但预览会消失。')) return;
        delVideo(p.videoId);
        p.videoId = null; p.videoRec = null;
        persist(); renderDetail();
      });
    }
  });
}

function handleVideoFile(p, file){
  if (!file) return;
  if (file.type.indexOf('video') !== 0){ alert('选一个视频文件'); return; }
  const rec = { id: 'v' + Date.now(), name: file.name, size: file.size, type: file.type, duration: 0, blob: file };
  const tmp = document.createElement('video');
  tmp.preload = 'metadata';
  const cleanup = function(){ try { tmp.removeAttribute('src'); tmp.load(); } catch (e) {} };

  tmp.onloadedmetadata = function(){
    rec.duration = tmp.duration || 0;
    cleanup();
    putVideo(rec).then(function(){
      if (p.videoId && p.videoId !== rec.id) delVideo(p.videoId);
      p.videoId = rec.id;
      p.videoRec = rec;
      persist();
      renderDetail();
    }).catch(function(){
      alert('存不下了。换个小一点的视频，或者清理一下浏览器数据。');
    });
  };
  tmp.onerror = function(){
    cleanup();
    alert('这个格式读不了，试试 mp4。');
  };
  tmp.src = URL.createObjectURL(file);
}

  };
  v.ontimeupdate = function(){

function closePlayer(){
  const v = document.getElementById('playerVideo');

  document.getElementById('player').classList.remove('on');

function jumpToClip(id){
  const c = S.clips.filter(function(x){ return x.id === id; })[0];
  if (!c) return;
  const p = S.projects.filter(function(x){ return x.id === c.projectId; })[0];
  if (!p || !p.videoId){
    alert('这条素材关联的项目还没有本地视频，定位不了画面。');
    return;
  }
  getVideo(p.videoId).then(function(rec){
    if (!rec){ alert('视频不在了，可能被清理过。'); return; }
    openPlayer(rec, c.start, c.projectId);
  });
}

function markMoment(){
  const v = document.getElementById('playerVideo');
  const t = v.currentTime || 0;
  const src = v.src;
  v.pause();

  pendingMark = { time: t, thumb: null };
  modalKind = 'clip';

  document.getElementById('modalTitle').textContent = '记这一刻 · ' + fmtTime(t);
  document.getElementById('modalBody').innerHTML =
    '<div style="display:flex;gap:12px;margin-bottom:14px;align-items:center">' +
      '<div class="clip-thumb" id="markThumb" style="width:96px;height:64px">截帧中</div>' +
      '<div style="flex:1;font-size:11.5px;color:#5C6360;line-height:1.6">时间码 <b>' + fmtTime(t) + '</b><br>截帧会自动存成缩略图</div>' +
    '</div>' +
    '<div class="fld"><label>这一条是什么</label><textarea id="markText" placeholder="例如：女主把钥匙摔在桌上，说这房子我不要了"></textarea></div>' +
    '<div class="fld"><label>类型</label><select id="markType">' +
      RWTYPE.map(function(x){ return '<option>' + x + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="fld"><label>标签（空格分隔，方便以后搜）</label><input id="markTags" placeholder="摔门 学区房 情绪爆发"></div>';
  document.getElementById('modalSave').style.display = '';
  document.getElementById('modal').classList.add('on');

  grabThumb(src, t).then(function(url){
    if (pendingMark) pendingMark.thumb = url;
    const el = document.getElementById('markThumb');
    if (!el) return;
    if (url){
      el.outerHTML = '<img class="clip-thumb" src="' + url + '" style="width:96px;height:64px">';
    } else {
      el.textContent = '截帧失败';
    }
  });
}

function saveMark(){
  const textEl = document.getElementById('markText');
  const text = textEl.value.trim();
  if (!text){ textEl.focus(); return; }
  const type = document.getElementById('markType').value;
  const tags = document.getElementById('markTags').value.split(/[\s,，、]+/).filter(Boolean);

  S.clips.unshift({
    id: 'c' + Date.now(),
    projectId: playerProjectId || S.detailId,
    ep: 1,
    type: type,
    text: text,
    tags: tags,
    start: pendingMark ? pendingMark.time : null,
    thumb: pendingMark ? pendingMark.thumb : null,
    used: false
  });
  pendingMark = null;
  persist(); closeModal(); renderDetail();

  const v = document.getElementById('playerVideo');
  if (v && document.getElementById('player').classList.contains('on')){
    v.play().catch(function(){});
  }
}

/* ============================================================
   字幕导入
   ============================================================ */
function importSrtFlow(p){
  modalKind = 'srt';
  document.getElementById('modalTitle').textContent = '粘贴字幕';
  document.getElementById('modalBody').innerHTML =
    '<div class="fld"><label>SRT 格式，直接粘内容</label>' +
      '<textarea id="srtText" style="min-height:170px;font-size:11.5px" placeholder="1&#10;00:00:03,000 --> 00:00:06,500&#10;这房子我不要了"></textarea></div>' +
    '<div style="font-size:11px;color:#939A96;line-height:1.65">每条字幕会变成一条可搜的素材。缩略图不批量生成，点开时再截。</div>';
  document.getElementById('modalSave').style.display = '';
  document.getElementById('modal').classList.add('on');
}

function saveSrt(){
  const txt = document.getElementById('srtText').value;
  const rows = parseSRT(txt);
  if (!rows.length){ alert('没解析出字幕，检查一下是不是 SRT 格式'); return; }
  rows.forEach(function(r, i){
    S.clips.push({
      id: 'c' + Date.now() + '_' + i,
      projectId: S.detailId,
      ep: 1,
      type: '高光片段',
      text: r.text,
      tags: [],
      start: r.start,
      thumb: null,
      used: false
    });
  });
  persist(); closeModal(); renderDetail();
}

/* ============================================================
   项目
   ============================================================ */
function renderProject(){
  const box = document.getElementById('projList');
  document.getElementById('projCount').textContent = S.projects.length;

  if (!S.projects.length){
    box.innerHTML = '<div class="empty">' + ICO.project + '<b>还没有项目</b>点右上角「新建」记录你正在做的，<br>发布后回来填数据，复盘页会自动算命中率。' +
      '<div style="margin-top:18px"><button class="btn ghost sm" id="seedDemo">先载入示例数据看看</button></div></div>';
    document.getElementById('seedDemo').addEventListener('click', function(){
      S.projects = [
        { id:'demo1', name:'一套学区房', genreId:'shijing', plat:'hongguo', eps:62, cost:750, heat:6240, createdAt:'2026-10-02' },
        { id:'demo2', name:'九幽剑主·第一季', genreId:'xuanhuan', plat:'hongguo', eps:70, cost:1100, heat:3100, createdAt:'2026-10-11' },
        { id:'demo3', name:'聚宝仙盆外传', genreId:'xuanhuan', plat:'hongguo', eps:66, cost:950, heat:2400, createdAt:'2026-10-19' },
        { id:'demo4', name:'我妈的记账本', genreId:'shijing', plat:'hongguo', eps:45, cost:800, heat:null, createdAt:'2026-11-06' }
      ];
      persist(); renderProject();
    });
    return;
  }

  box.innerHTML = S.projects.map(function(p){
    const g = DATA.genres.filter(function(x){ return x.id === p.genreId; })[0];
    const gname = g ? g.name : '未分类';
    const bm = DATA.benchmark[p.plat] || DATA.benchmark.hongguo;
    const has = p.heat !== null && p.heat !== undefined && p.heat !== '';
    const pass = has && Number(p.heat) >= bm.threshold;
    const cost = (p.eps || 0) * (p.cost || 0);

    let dataHtml;
    if (!has){
      dataHtml = '<div class="pdata"><div>数据 <b style="color:#939A96">待回填</b></div>' +
        '<div>门槛 <b>' + bm.threshold + bm.unit + '</b></div></div>';
    } else {
      dataHtml = '<div class="pdata">' +
        '<div>' + bm.label + '<b>' + p.heat + bm.unit + '</b></div>' +
        '<div>门槛<b>' + bm.threshold + bm.unit + '</b></div>' +
        '<div>结果<b class="' + (pass ? 'pass' : 'fail') + '">' + (pass ? '进榜' : '未进') + '</b></div>' +
      '</div>';
    }

    return '<div class="pitem" data-id="' + p.id + '">' +
      '<div class="top"><div>' +
        '<div class="nm2">' + esc(p.name) + '</div>' +
        '<div class="mt">' + esc(gname) + ' · ' + PLATN[p.plat] + ' · ' + (p.eps || 0) + ' 集 · ' + (cost ? (cost / 10000).toFixed(1) + ' 万' : '—') + '</div>' +
      '</div>' +
      '<span class="stat ' + (has ? 'out' : 'dev') + '">' + (has ? '已发布' : '制作中') + '</span></div>' +
      dataHtml +
    '</div>';
  }).join('');

  Array.prototype.forEach.call(box.querySelectorAll('.pitem'), function(el){
    el.addEventListener('click', function(){ openDetail(el.getAttribute('data-id')); });
  });
}

let modalKind = 'project';
let editingId = null;

function openModal(id){
  modalKind = 'project';
  document.getElementById('modalSave').style.display = '';
  editingId = id || null;
  const p = id ? S.projects.filter(function(x){ return x.id === id; })[0] : null;
  const bm = DATA.benchmark[S.plat];

  document.getElementById('modalTitle').textContent = p ? '编辑项目' : '新建项目';
  document.getElementById('modalBody').innerHTML =
    '<div class="fld"><label>剧名</label><input id="mName" placeholder="例如：一套学区房" value="' + (p ? esc(p.name) : '') + '"></div>' +
    '<div class="fld"><label>题材</label><select id="mGenre">' +
      DATA.genres.map(function(g){
        const sel = p && p.genreId === g.id ? ' selected' : '';
        return '<option value="' + g.id + '"' + sel + '>' + esc(g.name) + '</option>';
      }).join('') +
    '</select></div>' +
    '<div class="fld"><label>平台</label><div class="segmini" id="mPlat">' +
      '<button type="button" data-v="hongguo" class="' + ((p ? p.plat : S.plat) === 'hongguo' ? 'on' : '') + '">红果</button>' +
      '<button type="button" data-v="douyin" class="' + ((p ? p.plat : S.plat) === 'douyin' ? 'on' : '') + '">抖音</button>' +
    '</div></div>' +
    '<div class="fld2">' +
      '<div class="fld"><label>集数</label><input id="mEps" type="number" min="0" value="' + (p ? p.eps || '' : '') + '" placeholder="40"></div>' +
      '<div class="fld"><label>单集成本（元）</label><input id="mCost" type="number" min="0" value="' + (p ? p.cost || '' : '') + '" placeholder="800"></div>' +
    '</div>' +
    '<div class="fld"><label>' + bm.label + '（' + bm.unit + '，发布后回填）</label>' +
      '<input id="mHeat" type="number" step="0.01" value="' + (p && p.heat !== null && p.heat !== undefined ? p.heat : '') + '" placeholder="留空表示还没发布"></div>' +
    '<div class="qmiss" id="mHint" style="background:#F5F4F0;color:#5C6360;margin-top:4px">填了集数和单集成本，这里会算总成本，并对一下行业基准。</div>' +
    (p ? '<div style="margin-top:14px"><button class="btn ghost" id="mDel">删除这个项目</button></div>' : '');

  const platBox = document.getElementById('mPlat');
  Array.prototype.forEach.call(platBox.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(platBox.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
    });
  });

  ['mEps', 'mCost'].forEach(function(id){
    document.getElementById(id).addEventListener('input', updModalHint);
  });
  updModalHint();

  if (p){
    document.getElementById('mDel').addEventListener('click', function(){
      if (!confirm('删除这个项目？它下面的素材索引也会一起清掉。')) return;
      S.projects = S.projects.filter(function(x){ return x.id !== p.id; });
      S.clips = S.clips.filter(function(c){ return c.projectId !== p.id; });
      persist(); closeModal();
      if (S.tab === 'detail'){ go('project'); }
      renderProject();
    });
  }

  document.getElementById('modal').classList.add('on');
}

function updModalHint(){
  const epsEl = document.getElementById('mEps');
  const costEl = document.getElementById('mCost');
  const hint = document.getElementById('mHint');
  if (!epsEl || !costEl || !hint) return;
  const eps = parseInt(epsEl.value, 10) || 0;
  const cost = parseFloat(costEl.value) || 0;
  if (!eps || !cost){
    hint.innerHTML = '填了集数和单集成本，这里会算总成本，并对一下行业基准。';
    return;
  }
  const total = eps * cost;
  hint.innerHTML = '总成本 <b>' + (total / 10000).toFixed(1) + ' 万</b> · ' + eps + ' 集' +
    (eps >= 60
      ? '，够到中长剧基本盘（在榜作品 60 集以上占 94%）'
      : '，低于 60 集基本盘，很难吃到平台的中长剧激励');
}

function closeModal(){
  document.getElementById('modal').classList.remove('on');
  editingId = null;
}

function saveModal(){
  if (modalKind === 'clip'){ saveMark(); return; }
  if (modalKind === 'srt'){ saveSrt(); return; }
  const name = document.getElementById('mName').value.trim();
  if (!name){ document.getElementById('mName').focus(); return; }
  const genreId = document.getElementById('mGenre').value;
  const pb = document.getElementById('mPlat');
  const plat = pb.querySelector('button.on').getAttribute('data-v');
  const eps = parseInt(document.getElementById('mEps').value, 10) || 0;
  const cost = parseFloat(document.getElementById('mCost').value) || 0;
  const heatRaw = document.getElementById('mHeat').value;
  const heat = heatRaw === '' ? null : parseFloat(heatRaw);

  if (editingId){
    const p = S.projects.filter(function(x){ return x.id === editingId; })[0];
    if (p){ p.name = name; p.genreId = genreId; p.plat = plat; p.eps = eps; p.cost = cost; p.heat = heat; }
  } else {
    S.projects.unshift({
      id: 'p' + Date.now(),
      name: name, genreId: genreId, plat: plat, eps: eps, cost: cost, heat: heat,
      createdAt: new Date().toISOString().slice(0, 10)
    });
  }
  persist(); closeModal();
  renderProject();
  if (S.tab === 'detail') renderDetail();
}

/* 素材的新建入口在项目详情页：上传视频 → 播放 → 记这一刻；或粘贴 SRT 字幕批量导入。 */

/* ============================================================
   复盘
   ============================================================ */
function renderReview(){
  const box = document.getElementById('reviewOut');
  const pubs = S.projects.filter(function(p){
    return p.heat !== null && p.heat !== undefined && p.heat !== '';
  });

  if (!S.projects.length){
    box.innerHTML = '<div class="empty">' + ICO.review + '<b>复盘还没有数据</b>先去「项目」记录一个，<br>发布后把' + DATA.benchmark[S.plat].label + '填回来，这里会自动算命中率。</div>' +
      '<div class="card"><div class="sec-t" style="margin-top:0">复盘在算什么</div>' +
      '<div class="res-d">你的项目里，有多少进了百强门槛（' + PLATN[S.plat] + '端 ' + DATA.benchmark[S.plat].threshold + DATA.benchmark[S.plat].unit + '）。<br><br>' +
      '更重要的是偏科诊断：你反复选的题材，是不是恰好是机会指数最低的那几个。</div></div>';
    return;
  }

  let passCount = 0;
  pubs.forEach(function(p){
    const bm = DATA.benchmark[p.plat] || DATA.benchmark.hongguo;
    if (Number(p.heat) >= bm.threshold) passCount++;
  });
  const rate = pubs.length ? passCount / pubs.length : 0;

  const R = 38, CIRC = 2 * Math.PI * R, OFF = CIRC * (1 - rate);
  const ringSvg =
    '<svg width="92" height="92" viewBox="0 0 92 92">' +
      '<circle cx="46" cy="46" r="' + R + '" fill="none" stroke="#EDEBE5" stroke-width="8"/>' +
      '<circle cx="46" cy="46" r="' + R + '" fill="none" stroke="#34497A" stroke-width="8" ' +
        'stroke-dasharray="' + CIRC.toFixed(1) + '" stroke-dashoffset="' + OFF.toFixed(1) + '" ' +
        'stroke-linecap="round" transform="rotate(-90 46 46)"/>' +
      '<text x="46" y="47" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#1C2321">' +
        Math.round(rate * 100) + '%</text>' +
    '</svg>';

  const dist = {};
  S.projects.forEach(function(p){
    dist[p.genreId] = (dist[p.genreId] || 0) + 1;
  });
  const distArr = Object.keys(dist).map(function(k){
    const g = DATA.genres.filter(function(x){ return x.id === k; })[0];
    return { id: k, name: g ? g.name : '未分类', n: dist[k], score: g ? calc(g, S.plat).total : 0 };
  }).sort(function(a, b){ return b.n - a.n; });
  const maxN = Math.max.apply(null, distArr.map(function(d){ return d.n; }));

  const distHtml = distArr.map(function(d){
    return '<div class="dist-row"><span class="dn">' + esc(d.name) + '</span>' +
      '<span class="db"><i style="width:' + (d.n / maxN * 100) + '%"></i></span>' +
      '<span class="dv">' + d.n + '</span></div>';
  }).join('');

  const top = distArr[0];
  let diagHtml = '';
  if (top && S.projects.length >= 2){
    const share = Math.round(top.n / S.projects.length * 100);
    if (top.score < 60){
      diagHtml = '<div class="diag"><b>偏科了。</b>你 ' + S.projects.length + ' 个项目里有 ' + top.n + ' 个是「' + esc(top.name) +
        '」，占 ' + share + '%。但这个题材在' + PLATN[S.plat] + '端的机会指数只有 <b>' + top.score + '</b>——你的产出集中在最挤的地方。</div>';
    } else if (share >= 70){
      diagHtml = '<div class="diag"><b>过于集中。</b>' + share + '% 的项目都在「' + esc(top.name) +
        '」。它现在机会指数是 ' + top.score + '，但题材轮动很快，建议留一个项目去做时间差方向。</div>';
    } else {
      diagHtml = '<div class="diag"><b>结构还行。</b>题材分散在 ' + distArr.length + ' 个方向上，没有明显偏科。下一步是看哪个方向的完播更好。</div>';
    }
  }

  const pending = S.projects.length - pubs.length;
  box.innerHTML =
    '<div class="card"><div class="sec-t" style="margin-top:0">我的命中率</div>' +
      '<div class="ring">' + ringSvg +
        '<div class="rt">已发布 <b>' + pubs.length + '</b> 个，<b>' + passCount + '</b> 个进了百强门槛。' +
        (pending ? '<br>还有 <b>' + pending + '</b> 个在制作中。' : '') +
        (pubs.length ? '' : '<br>发布后回填数据才会开始算。') +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card"><div class="sec-t" style="margin-top:0">题材分布</div><div class="dist">' + distHtml + '</div></div>' +
    diagHtml +
    '<div class="card"><div class="sec-t" style="margin-top:0">下一步</div>' +
      '<div class="res-d">' + nextStep() + '</div></div>';
}

function nextStep(){
  const list = ranked(S.plat);
  const best = list.filter(function(x){
    return S.projects.every(function(p){ return p.genreId !== x.g.id; });
  })[0] || list[0];
  return '你还没做过的题材里，' + esc(best.g.name) + ' 的机会指数最高（' + best.r.total + '）。' +
    '它在' + PLATN[S.plat] + '端只有 ' + best.r.count + ' 部在榜，可以先做一集样片试水。';
}

/* ============================================================
   导航
   ============================================================ */
function go(tab){
  S.tab = tab;
  document.getElementById('tbTitle').textContent = TITLES[tab] || '';
  Array.prototype.forEach.call(document.querySelectorAll('.page'), function(p){ p.classList.remove('active'); });
  document.getElementById('page-' + tab).classList.add('active');
  const navTab = tab === 'detail' ? 'project' : (tab === 'data' ? 'radar' : tab);
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    t.classList.toggle('on', t.getAttribute('data-tab') === navTab);
  });
  if (tab === 'radar') renderRadar();
  if (tab === 'rework') renderRework();
  if (tab === 'project') renderProject();
  if (tab === 'review') renderReview();
  if (tab === 'detail') renderDetail();
  if (tab === 'data') renderData();
}

function syncPlat(){
  document.getElementById('platSwitch').textContent = PLATN[S.plat];
  document.getElementById('tbSub').textContent = PLATN[S.plat] + ' · 11 月第 3 周';
  if (S.tab === 'radar') renderRadar();
  if (S.tab === 'rework') renderRework();
  if (S.tab === 'review') renderReview();
}

/* ---------- 初始化 ---------- */
function init(){
  load();
  loadSettings();

  const sb = document.getElementById('sbTime');
  if (sb){
    const now = new Date();
    sb.textContent = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  if (!S.remoteUrl && location.protocol.indexOf('http') === 0){
    S.remoteUrl = './data.json';
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){ go(t.getAttribute('data-tab')); });
  });

  document.getElementById('platSwitch').addEventListener('click', function(){
    S.plat = S.plat === 'hongguo' ? 'douyin' : 'hongguo';
    syncPlat();
  });

  document.getElementById('titleCheck').addEventListener('click', runTitle);
  document.getElementById('titleInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') runTitle();
  });

  Array.prototype.forEach.call(document.getElementById('reworkSeg').querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.getElementById('reworkSeg').querySelectorAll('button'), function(x){
        x.classList.remove('on');
      });
      b.classList.add('on');
      S.clipFilter = b.getAttribute('data-v');
      renderRework();
    });
  });

  const searchEl = document.getElementById('clipSearch');
  searchEl.addEventListener('input', function(){ S.clipQuery = this.value; renderRework(); });
  document.getElementById('clipExport').addEventListener('click', exportClips);
  document.getElementById('clipSearchBtn').addEventListener('click', function(){
    S.clipQuery = searchEl.value;
    renderRework();
  });

  document.getElementById('detailBack').addEventListener('click', function(){ go('project'); });
  document.getElementById('dataBack').addEventListener('click', function(){ go('radar'); });
  document.getElementById('freshRow').addEventListener('click', function(){ go('data'); });
  document.getElementById('playerClose').addEventListener('click', closePlayer);
  document.getElementById('markBtn').addEventListener('click', markMoment);

  updateBasis();

  if (S.remoteUrl && S.autoSync){
    syncRemote(true);
  }

  Array.prototype.forEach.call(document.getElementById('radarSeg').querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.getElementById('radarSeg').querySelectorAll('button'), function(x){
        x.classList.remove('on');
      });
      b.classList.add('on');
      const v = b.getAttribute('data-v');
      document.getElementById('radarList').style.display = v === 'list' ? '' : 'none';
      document.getElementById('radarDiag').style.display = v === 'diag' ? '' : 'none';
    });
  });

  document.getElementById('diagBtn').addEventListener('click', runDiag);
  document.getElementById('diagInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runDiag();
  });

  document.getElementById('addProj').addEventListener('click', function(){ openModal(null); });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveModal);
  document.getElementById('modal').addEventListener('click', function(e){
    if (e.target === this) closeModal();
  });

  syncPlat();
  go('radar');
}

init();
</script>
